name: Nexa Commerce starter

"on": [push, pull_request]

defaults:
  run:
    shell: bash
    working-directory: project

jobs:
  catalog:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_dev_only
          POSTGRES_DB: catalog_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d catalog_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://nexa:nexa_dev_only@127.0.0.1:5432/catalog_db
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Check catalog against seeded PostgreSQL
        run: |
          ./target/debug/catalog-service &
          catalog_pid=$!
          trap 'kill "$catalog_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8082/healthz
          curl --fail --silent --show-error http://127.0.0.1:8082/api/v1/catalog/products |
            jq -e 'map(.sku) == ["DEMO-MUG", "DEMO-TSHIRT"] and all(.[]; .status == "active" and (.id | type == "string") and (.title | type == "string"))'
          curl --fail --silent --show-error 'http://127.0.0.1:8082/api/v1/catalog/products?limit=1' |
            jq -e 'map(.sku) == ["DEMO-MUG"]'
          product_url=http://127.0.0.1:8082/api/v1/catalog/products/019b0000-0000-7000-8000-000000000002
          curl --fail --silent --show-error "$product_url" |
            jq -e '. == {id: "019b0000-0000-7000-8000-000000000002", sku: "DEMO-MUG", title: "Nexa Demo Mug", status: "active"}'
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${product_url%/*}/00000000-0000-0000-0000-000000000000")
          test "$status" = 404
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U nexa -d catalog_db \
            -c "UPDATE product SET status = 'archived' WHERE sku = 'DEMO-MUG'"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$product_url")
          test "$status" = 404
          curl --fail --silent --show-error "${product_url%/*}" |
            jq -e 'map(.sku) == ["DEMO-TSHIRT"]'

  clients:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: project/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @nexa/storefront-web build
      - run: pnpm --filter @nexa/desktop build
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
