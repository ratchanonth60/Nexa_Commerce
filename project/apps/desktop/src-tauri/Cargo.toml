[package]
name = "nexa-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
signed-updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
base64 = "0.22"
jsonwebtoken = { version = "9", default-features = false }
ring = "0.17"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "process", "sync", "time"] }
url = { version = "2", features = ["serde"] }
uuid = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls"], optional = true }
