services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [auth]
    command: start-dev --import-realm --hostname http://127.0.0.1:8080
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./keycloak/nexa-realm.json:/opt/keycloak/data/import/nexa-realm.json:ro
      - nexa_keycloak_data:/opt/keycloak/data
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev_only
      POSTGRES_DB: catalog_db
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nexa_catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  pricing-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev_only
      POSTGRES_DB: pricing_db
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - nexa_pricing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d pricing_db"]
      interval: 5s
