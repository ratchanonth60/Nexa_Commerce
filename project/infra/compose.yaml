      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev_only
      POSTGRES_DB: payment_db
    ports:
      - '127.0.0.1:5437:5432'
    volumes:
      - nexa_payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d payment_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
volumes:
  nexa_keycloak_data:
  nexa_catalog_pgdata:
  nexa_pricing_pgdata:
  nexa_inventory_pgdata:
  nexa_cart_pgdata:
  nexa_order_pgdata:
  nexa_payment_pgdata:
