      retries: 10
  inventory-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev_only
      POSTGRES_DB: inventory_db
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - nexa_inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  cart-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev_only
      POSTGRES_DB: cart_db
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - nexa_cart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d cart_db"]
      interval: 5s
