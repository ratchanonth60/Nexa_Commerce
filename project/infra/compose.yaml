      retries: 10
  order-postgres:
    profiles: [checkout]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev_only
      POSTGRES_DB: order_db
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - nexa_order_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d order_db"]
      interval: 5s
