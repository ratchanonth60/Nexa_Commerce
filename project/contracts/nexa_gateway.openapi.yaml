openapi: 3.0.3
info:
  title: Nexa Commerce Gateway API (Draft)
  version: 0.1.0
  description: Draft only. Endpoints require full auth/authorization, validation and integration before production.
servers:
  - url: https://api.example.com
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /api/v1/catalog/products:
    get:
      summary: List public product metadata
      operationId: listProducts
      security: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Page of product metadata without price and stock
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Product'}
        '400':
          description: Limit must be an integer between 1 and 100
  /api/v1/catalog/products/{productId}:
    get:
      summary: Read active product metadata
      operationId: getProduct
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400':
          description: Product ID must be a UUID
        '404':
          description: No active product found with this ID
  /api/v1/search/products:
    get:
      summary: Search active products by title and SKU
      operationId: searchProducts
      security: []
      parameters:
        - {in: query, name: q, required: true, schema: {type: string, minLength: 1, maxLength: 120}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Products ordered by relevance, then title and ID
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Product'}}
        '400': {description: Invalid search query or limit}
  /api/v1/pricing/quotes:
    get:
      summary: Read a storefront price quote for display
      operationId: getPriceQuote
      security: []
      parameters:
        - {in: query, name: product_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: currency, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
        - {in: query, name: channel, required: true, schema: {type: string, pattern: '^[a-z0-9-]{1,32}$'}}
      responses:
        '200':
          description: Display quote valid for five minutes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PriceQuote'}
        '400': {description: Missing or invalid quote parameters}
        '404': {description: No price configured for this product, currency and channel}
  /api/v1/inventory/availability:
    get:
      summary: Check stock availability for a requested quantity
      operationId: getAvailability
      security: []
      parameters:
        - {in: query, name: product_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: quantity, required: true, schema: {type: integer, minimum: 1, maximum: 9999}}
      responses:
        '200':
          description: Availability at the time of the read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Availability'}
        '400': {description: Missing or invalid availability parameters}
        '404': {description: No stock record for this product}
  /api/v1/carts:
    post:
      summary: Create a cart for the authenticated customer
      operationId: createCart
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        '201':
          description: Empty cart with version zero
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Invalid browser origin or CSRF token}
        '503': {$ref: '#/components/responses/CartUnavailable'}
  /api/v1/carts/{cartId}:
    get:
      summary: Read owned cart
      operationId: readCart
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '400': {description: Cart ID must be a UUID}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/CartUnavailable'}
  /api/v1/carts/{cartId}/items:
    post:
      summary: Add item to owned cart
      operationId: addCartItem
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddCartItem'}
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '400': {description: Invalid cart ID or item payload}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Active product not found}
        '409': {description: Total quantity for the product would exceed 9999}
        '503': {$ref: '#/components/responses/CartUnavailable'}
  /api/v1/checkouts:
    post:
      summary: Queue a local sandbox checkout with idempotency
      operationId: createCheckout
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 12, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCheckout'}
      responses:
        '202':
          description: Checkout accepted for processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutStatus'}
        '409':
          description: Conflicting idempotency payload, unavailable cart snapshot, or existing active order for this cart
        '400': {description: Invalid request or idempotency key}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Invalid sandbox payment or unsupported shipping address}
        '503': {description: Sandbox checkout is disabled}
  /api/v1/checkouts/{checkoutId}:
    get:
      summary: Poll Saga status
      operationId: getCheckout
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/orders/{orderId}:
    get:
      summary: Read order with authorization check
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/orders/{orderId}/shipment:
    get:
      summary: Read the shipment for an owned order
      operationId: getCustomerShipment
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200': {$ref: '#/components/responses/ShipmentResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Shipment is awaiting creation}
  /api/v1/orders/{orderId}/notifications:
    get:
      summary: List dispatch and delivery notifications for an owned order
      operationId: getShipmentNotifications
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Shipment notifications in delivery order
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ShipmentNotification'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/ops/inventory/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      summary: Read stock totals as an operator
      operationId: getOperatorStock
      responses:
        '200': {$ref: '#/components/responses/StockResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      summary: Adjust on-hand stock as an operator
      operationId: adjustOperatorStock
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_on_hand, on_hand]
              properties:
                expected_on_hand: {type: integer, minimum: 0}
                on_hand: {type: integer, minimum: 0}
      responses:
        '200': {$ref: '#/components/responses/StockResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Stock changed or the requested count is below reservations and allocations}
  /api/v1/ops/shipments/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      summary: Read shipment status as an operator
      operationId: getOperatorShipment
      responses:
        '200': {$ref: '#/components/responses/ShipmentResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      summary: Advance a shipment as an operator
      operationId: advanceOperatorShipment
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_status, status]
              properties:
                expected_status: {$ref: '#/components/schemas/ShipmentStatus'}
                status: {$ref: '#/components/schemas/ShipmentStatus'}
      responses:
        '200': {$ref: '#/components/responses/ShipmentResult'}
        '202': {description: Dispatch queued, content: {application/json: {schema: {$ref: '#/components/schemas/Shipment'}}}}
        '400': {description: Invalid shipment status transition}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Shipment status changed}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nexa_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Value from GET /auth/session. Browser writes also require the storefront Origin.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId: {in: path, name: productId, required: true, schema: {type: string, format: uuid}}
    CartId: {in: path, name: cartId, required: true, schema: {type: string, format: uuid}}
    CheckoutId: {in: path, name: checkoutId, required: true, schema: {type: string, format: uuid}}
    OrderId: {in: path, name: orderId, required: true, schema: {type: string, format: uuid}}
  responses:
    ShipmentResult:
      description: Current shipment state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Shipment'}
    StockResult:
      description: Current stock totals
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Stock'}
    NotFound: {description: Resource not found}
    Forbidden: {description: Not authorized for this resource}
    Unauthorized:
      description: Missing, expired, or invalid access token or browser session
      headers:
        WWW-Authenticate:
          schema: {type: string, example: Bearer}
    CartUnavailable: {description: Access token validation has not been configured}
  schemas:
    ShipmentStatus:
      type: string
      enum: [pending, packed, dispatched, delivered]
    Shipment:
      type: object
      required: [id, order_id, status]
      properties:
        id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
    ShipmentNotification:
      type: object
      required: [event_id, order_id, shipment_id, status, event_type, occurred_at]
      properties:
        event_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        shipment_id: {type: string, format: uuid}
        status: {type: string, enum: [dispatched, delivered]}
        event_type: {type: string}
        occurred_at: {type: string, format: date-time}
    Stock:
      type: object
      required: [product_id, on_hand, reserved, allocated]
      properties:
        product_id: {type: string, format: uuid}
        on_hand: {type: integer, minimum: 0}
        reserved: {type: integer, minimum: 0}
        allocated: {type: integer, minimum: 0}
    Product:
      type: object
      required: [id, sku, title, status]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        title: {type: string}
        status: {type: string, enum: [draft, active, archived]}
    PriceQuote:
      type: object
      required: [quote_id, product_id, currency, unit_amount_minor, expires_at, rule_version]
      properties:
        quote_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        unit_amount_minor: {type: string, pattern: '^[0-9]+$'}
        expires_at: {type: string, format: date-time}
        rule_version: {type: integer, minimum: 1}
    Availability:
      type: object
      required: [product_id, quantity, available]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 9999}
        available: {type: boolean}
    Cart:
      type: object
      required: [id, items, version]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64}
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1}
    AddCartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 9999}
    CreateCheckout:
      type: object
      required: [cart_id, cart_version, payment_method_token]
      properties:
        cart_id: {type: string, format: uuid}
        cart_version: {type: integer, format: int64}
        payment_method_token: {type: string, enum: [sandbox_approve, sandbox_decline]}
    CheckoutStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [created, confirmed, failed]
        order_id: {type: string, format: uuid, nullable: true}
        failure_reason_code: {type: string, nullable: true}
    Order:
      type: object
      required: [id, status, currency, total_minor, items]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        currency: {type: string, minLength: 3, maxLength: 3, example: THB}
        total_minor: {type: string, pattern: '^[0-9]+$', description: Integer minor units as string to preserve precision}
        items:
          type: array
          items:
            type: object
            required: [product_id, sku, title, quantity, unit_amount_minor, rule_version]
            properties:
              product_id: {type: string, format: uuid}
              sku: {type: string}
              title: {type: string}
              quantity: {type: integer, minimum: 1, maximum: 9999}
              unit_amount_minor: {type: string, pattern: '^[0-9]+$'}
              rule_version: {type: integer, minimum: 1}
