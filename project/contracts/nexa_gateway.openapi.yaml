openapi: 3.0.3
info:
  title: Nexa Commerce Gateway API (Draft)
  version: 0.1.0
  description: Draft only. Endpoints require full auth/authorization, validation and integration before production.
servers:
  - url: https://api.example.com
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /api/v1/catalog/products:
    get:
      summary: List public product metadata
      operationId: listProducts
      security: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Page of product metadata without price and stock
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Product'}
        '400':
          description: Limit must be an integer between 1 and 100
  /api/v1/catalog/products/{productId}:
    get:
      summary: Read active product metadata
      operationId: getProduct
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400':
          description: Product ID must be a UUID
        '404':
          description: No active product found with this ID
  /api/v1/pricing/quotes:
    get:
      summary: Read a storefront price quote for display
      operationId: getPriceQuote
      security: []
      parameters:
        - {in: query, name: product_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: currency, required: true, schema: {type: string, pattern: '^[A-Z]{3}$'}}
        - {in: query, name: channel, required: true, schema: {type: string, pattern: '^[a-z0-9-]{1,32}$'}}
      responses:
        '200':
          description: Display quote valid for five minutes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PriceQuote'}
        '400': {description: Missing or invalid quote parameters}
        '404': {description: No price configured for this product, currency and channel}
  /api/v1/inventory/availability:
    get:
      summary: Check stock availability for a requested quantity
      operationId: getAvailability
      security: []
      parameters:
        - {in: query, name: product_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: quantity, required: true, schema: {type: integer, minimum: 1, maximum: 9999}}
      responses:
        '200':
          description: Availability at the time of the read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Availability'}
        '400': {description: Missing or invalid availability parameters}
        '404': {description: No stock record for this product}
  /api/v1/carts:
    post:
      summary: Create a cart for the authenticated customer
      operationId: createCart
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Empty cart with version zero
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/CartUnavailable'}
  /api/v1/carts/{cartId}:
    get:
      summary: Read owned cart
      operationId: readCart
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '400': {description: Cart ID must be a UUID}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/CartUnavailable'}
  /api/v1/carts/{cartId}/items:
    post:
      summary: Add item to owned cart
      operationId: addCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddCartItem'}
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cart'}
        '400': {description: Invalid cart ID or item payload}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Active product not found}
        '409': {description: Total quantity for the product would exceed 9999}
        '503': {$ref: '#/components/responses/CartUnavailable'}
  /api/v1/checkouts:
    post:
      summary: Create checkout Saga with idempotency
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 12, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCheckout'}
      responses:
        '202':
          description: Checkout accepted for processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutStatus'}
        '409':
          description: Conflicting idempotency request or cart version
  /api/v1/checkouts/{checkoutId}:
    get:
      summary: Poll Saga status
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutStatus'}
  /api/v1/orders/{orderId}:
    get:
      summary: Read order with authorization check
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nexa_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId: {in: path, name: productId, required: true, schema: {type: string, format: uuid}}
    CartId: {in: path, name: cartId, required: true, schema: {type: string, format: uuid}}
    CheckoutId: {in: path, name: checkoutId, required: true, schema: {type: string, format: uuid}}
    OrderId: {in: path, name: orderId, required: true, schema: {type: string, format: uuid}}
  responses:
    NotFound: {description: Resource not found}
    Forbidden: {description: Not authorized for this resource}
    Unauthorized:
      description: Missing or invalid JWT access token
      headers:
        WWW-Authenticate:
          schema: {type: string, example: Bearer}
    CartUnavailable: {description: Access token validation has not been configured}
  schemas:
    Product:
      type: object
      required: [id, sku, title, status]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        title: {type: string}
        status: {type: string, enum: [draft, active, archived]}
    PriceQuote:
      type: object
      required: [quote_id, product_id, currency, unit_amount_minor, expires_at, rule_version]
      properties:
        quote_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        unit_amount_minor: {type: string, pattern: '^[0-9]+$'}
        expires_at: {type: string, format: date-time}
        rule_version: {type: integer, minimum: 1}
    Availability:
      type: object
      required: [product_id, quantity, available]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 9999}
        available: {type: boolean}
    Cart:
      type: object
      required: [id, items, version]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64}
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1}
    AddCartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 9999}
    CreateCheckout:
      type: object
      required: [cart_id, cart_version, payment_method_token]
      properties:
        cart_id: {type: string, format: uuid}
        cart_version: {type: integer, format: int64}
        shipping_address_id: {type: string, format: uuid}
        payment_method_token: {type: string, description: PSP token only; never raw card data}
    CheckoutStatus:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [created, pricing, reserved, authorizing, confirmed, failed, compensating]
        order_id: {type: string, format: uuid, nullable: true}
        failure_reason_code: {type: string, nullable: true}
    Order:
      type: object
      required: [id, status, currency, total_minor]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        currency: {type: string, minLength: 3, maxLength: 3, example: THB}
        total_minor: {type: string, pattern: '^[0-9]+$', description: Integer minor units as string to preserve precision}
