[package]
name = "catalog-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
diesel = { version = "~2.4.0", default-features = false, features = ["postgres_backend", "uuid"] }
diesel-async = { version = "0.10", features = ["postgres", "bb8", "migrations"] }
diesel_migrations = "~2.4.0"
thiserror = "2"
crc32fast = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "9.3.1", default-features = false, features = ["use_pem"] }
base64 = "0.22"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
subtle = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
